{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blockchain-network.fullname" . }}-dashboard
  labels:
    {{- include "blockchain-network.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blockchain Network Dashboard</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px;
            }
            .header { text-align: center; padding: 20px 0 30px; border-bottom: 1px solid #333; margin-bottom: 30px; }
            .header h1 { color: #00d4ff; font-size: 2rem; margin-bottom: 10px; }
            .header .status { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #888; }
            .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; }
            .status-dot.connected { background: #44ff44; }
            .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
            .stat-card { background: #16213e; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #333; }
            .stat-card .value { font-size: 2.5rem; font-weight: bold; color: #00d4ff; margin-bottom: 5px; }
            .stat-card .label { color: #888; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
            .section { margin-bottom: 30px; }
            .section h2 { color: #00d4ff; font-size: 1.3rem; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
            .nodes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
            .node-card { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #333; transition: transform 0.2s, border-color 0.2s; }
            .node-card:hover { transform: translateY(-2px); border-color: #00d4ff; }
            .node-card.inactive { opacity: 0.5; border-color: #ff4444; }
            .node-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
            .node-id { font-weight: bold; font-size: 1.1rem; }
            .node-role { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
            .node-role.miner { background: #ff9800; color: #000; }
            .node-role.wallet { background: #4caf50; color: #000; }
            .node-role.full { background: #2196f3; color: #fff; }
            .node-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .node-stat { background: #0f0f23; padding: 10px; border-radius: 8px; text-align: center; }
            .node-stat .value { font-size: 1.2rem; font-weight: bold; color: #fff; }
            .node-stat .label { font-size: 0.7rem; color: #666; text-transform: uppercase; }
            .node-address { margin-top: 10px; font-size: 0.75rem; color: #666; word-break: break-all; background: #0f0f23; padding: 8px; border-radius: 6px; font-family: monospace; }
            .mining-indicator { display: inline-flex; align-items: center; gap: 5px; color: #ff9800; font-size: 0.8rem; }
            .mining-indicator .pulse { width: 8px; height: 8px; background: #ff9800; border-radius: 50%; animation: pulse 1s infinite; }
            @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
            .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
            .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: background 0.2s, transform 0.1s; }
            .btn:active { transform: scale(0.98); }
            .btn-primary { background: #00d4ff; color: #000; }
            .btn-success { background: #4caf50; color: #fff; }
            .btn-warning { background: #ff9800; color: #000; }
            .btn-danger { background: #f44336; color: #fff; }
            .toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; background: #333; color: #fff; border-radius: 8px; opacity: 0; transform: translateY(20px); transition: opacity 0.3s, transform 0.3s; z-index: 1000; }
            .toast.show { opacity: 1; transform: translateY(0); }
            .toast.success { background: #4caf50; }
            .toast.error { background: #f44336; }
            .empty-state { text-align: center; padding: 40px; color: #666; }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>Blockchain Network Dashboard</h1>
            <div class="status">
                <span class="status-dot" id="connectionStatus"></span>
                <span id="connectionText">Disconnected</span>
                <span id="lastUpdate"></span>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="value" id="totalNodes">0</div><div class="label">Total Nodes</div></div>
            <div class="stat-card"><div class="value" id="activeNodes">0</div><div class="label">Active Nodes</div></div>
            <div class="stat-card"><div class="value" id="chainHeight">0</div><div class="label">Chain Height</div></div>
            <div class="stat-card"><div class="value" id="pendingTx">0</div><div class="label">Pending Tx</div></div>
            <div class="stat-card"><div class="value" id="miningNodes">0</div><div class="label">Mining Nodes</div></div>
        </div>
        <div class="section">
            <h2>Scenarios</h2>
            <div class="actions">
                <button class="btn btn-success" onclick="startMiners()">Start All Miners</button>
                <button class="btn btn-danger" onclick="stopMiners()">Stop All Miners</button>
                <button class="btn btn-primary" onclick="syncAll()">Sync All Nodes</button>
                <button class="btn btn-warning" onclick="transactionBurst()">Transaction Burst</button>
            </div>
        </div>
        <div class="section"><h2>Network Nodes</h2><div class="nodes-grid" id="nodesGrid"><div class="empty-state"><p>No nodes registered.</p></div></div></div>
        <div class="toast" id="toast"></div>
        <script>
            const POLL_INTERVAL = 3000;
            const ORCHESTRATOR_URL = '{{ .Values.dashboard.orchestratorUrl }}';
            let pollTimer = null;
            async function fetchNetworkStatus() {
                try {
                    const response = await fetch(ORCHESTRATOR_URL + '/api/orchestrator/network');
                    if (!response.ok) throw new Error('Failed');
                    return await response.json();
                } catch (e) { return null; }
            }
            function updateUI(data) {
                const statusDot = document.getElementById('connectionStatus');
                const statusText = document.getElementById('connectionText');
                if (!data) { statusDot.classList.remove('connected'); statusText.textContent = 'Disconnected'; return; }
                statusDot.classList.add('connected'); statusText.textContent = 'Connected';
                document.getElementById('lastUpdate').textContent = ' - ' + new Date().toLocaleTimeString();
                document.getElementById('totalNodes').textContent = data.totalNodes;
                document.getElementById('activeNodes').textContent = data.activeNodes;
                document.getElementById('chainHeight').textContent = data.maxChainHeight;
                document.getElementById('pendingTx').textContent = data.totalPendingTransactions;
                document.getElementById('miningNodes').textContent = data.miningNodes;
                renderNodes(data.nodes || []);
            }
            function renderNodes(nodes) {
                const grid = document.getElementById('nodesGrid');
                if (!nodes.length) { grid.innerHTML = '<div class="empty-state"><p>No nodes registered.</p></div>'; return; }
                grid.innerHTML = nodes.map(n => `
                    <div class="node-card ${n.active ? '' : 'inactive'}">
                        <div class="node-header"><span class="node-id">${n.nodeId}</span><span class="node-role ${n.role}">${n.role}</span></div>
                        ${n.mining ? '<div class="mining-indicator"><span class="pulse"></span> Mining</div>' : ''}
                        <div class="node-stats">
                            <div class="node-stat"><div class="value">${n.chainHeight}</div><div class="label">Height</div></div>
                            <div class="node-stat"><div class="value">${n.pendingTransactions}</div><div class="label">Pending</div></div>
                            <div class="node-stat"><div class="value">${n.balance.toFixed(2)}</div><div class="label">Balance</div></div>
                            <div class="node-stat"><div class="value">${n.active ? 'Yes' : 'No'}</div><div class="label">Active</div></div>
                        </div>
                        <div class="node-address">${n.walletAddress ? n.walletAddress.substring(0,10)+'...'+n.walletAddress.slice(-10) : 'N/A'}</div>
                    </div>
                `).join('');
            }
            function showToast(msg, type='info') {
                const t = document.getElementById('toast');
                t.textContent = msg; t.className = 'toast show ' + type;
                setTimeout(() => t.classList.remove('show'), 3000);
            }
            async function runScenario(endpoint, name) {
                try {
                    const r = await fetch(ORCHESTRATOR_URL + '/api/orchestrator/scenario/' + endpoint, {method:'POST'});
                    const res = await r.json();
                    showToast(name + ': ' + res.message, res.success ? 'success' : 'error');
                    poll();
                } catch(e) { showToast('Error: ' + e.message, 'error'); }
            }
            function startMiners() { runScenario('start-miners', 'Start Miners'); }
            function stopMiners() { runScenario('stop-miners', 'Stop Miners'); }
            function syncAll() { runScenario('sync-all', 'Sync All'); }
            function transactionBurst() { fetch(ORCHESTRATOR_URL + '/api/orchestrator/scenario/transaction-burst?count=10', {method:'POST'}).then(r=>r.json()).then(res=>{ showToast('Tx Burst: ' + res.message, res.success ? 'success' : 'error'); poll(); }).catch(e=>showToast('Error: '+e.message,'error')); }
            async function poll() { const data = await fetchNetworkStatus(); updateUI(data); }
            function startPolling() { poll(); pollTimer = setInterval(poll, POLL_INTERVAL); }
            startPolling();
        </script>
    </body>
    </html>
{{- end }}
