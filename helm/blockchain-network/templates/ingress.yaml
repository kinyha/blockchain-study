{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "blockchain-network.fullname" . }}
  labels:
    {{- include "blockchain-network.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "miner" }}
                name: {{ include "blockchain-network.fullname" $ }}-miner
                {{- else if eq .service "wallet" }}
                name: {{ include "blockchain-network.fullname" $ }}-wallet
                {{- else if eq .service "orchestrator" }}
                name: {{ include "blockchain-network.fullname" $ }}-orchestrator
                {{- else if eq .service "dashboard" }}
                name: {{ include "blockchain-network.fullname" $ }}-dashboard
                {{- else }}
                name: {{ include "blockchain-network.fullname" $ }}-fullnode
                {{- end }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
