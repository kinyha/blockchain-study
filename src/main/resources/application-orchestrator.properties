# Orchestrator Node Configuration
# Activate with: --spring.profiles.active=orchestrator

spring.application.name=blockchain-orchestrator

# Server settings
server.port=${PORT:8090}

# Node identification
node.id=orchestrator

# Orchestrator settings
orchestrator.request-timeout-ms=5000

# Disable blockchain-specific features (orchestrator doesn't mine or hold wallet)
# The orchestrator only coordinates other nodes
