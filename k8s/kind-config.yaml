# Конфигурация Kind кластера для локальной разработки
# Урок 10: Kind (Kubernetes IN Docker) - локальный K8s кластер

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: blockchain-cluster

nodes:
  # Control plane node
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Port mappings для доступа к сервисам
    extraPortMappings:
      # HTTP через Ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS через Ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # NodePort диапазон (опционально)
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP

  # Worker node (опционально, для более реалистичного кластера)
  # - role: worker
  # - role: worker

# Networking configuration
networking:
  # Disable default CNI and use kindnet
  disableDefaultCNI: false
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/12"
