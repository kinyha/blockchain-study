# Deployment для full-ноды (все функции: mining + wallet + sync)
# Урок 7: Labels и Selectors для группировки подов
apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-node
  namespace: blockchain
  labels:
    app.kubernetes.io/name: full-node
    app.kubernetes.io/component: full
    app.kubernetes.io/part-of: blockchain-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: full-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: full-node
        app.kubernetes.io/component: full
        # Дополнительные labels для отбора
        blockchain.io/role: full
        blockchain.io/sync-enabled: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: blockchain-node
          image: blockchain-node:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: blockchain-config
            - configMapRef:
                name: blockchain-peers

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_ROLE
              value: "full"
            - name: SPRING_PROFILES_ACTIVE
              value: "full"
            - name: SERVER_PORT
              value: "8080"

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /api/node/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/node/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
