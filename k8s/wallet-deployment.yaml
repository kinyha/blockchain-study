# Deployment для wallet-ноды
# Урок 7: Deployment с несколькими репликами
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-node
  namespace: blockchain
  labels:
    app.kubernetes.io/name: wallet-node
    app.kubernetes.io/component: wallet
    app.kubernetes.io/part-of: blockchain-network
spec:
  # Можно масштабировать wallet ноды
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wallet-node
        app.kubernetes.io/component: wallet
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: blockchain-node
          image: blockchain-node:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: blockchain-config
            - configMapRef:
                name: blockchain-peers

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_ROLE
              value: "wallet"
            - name: SPRING_PROFILES_ACTIVE
              value: "wallet"
            - name: SERVER_PORT
              value: "8080"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /api/node/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/node/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
