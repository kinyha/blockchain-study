# Secret для чувствительных данных
# Урок 9: Secret - для паролей, ключей, токенов
# ВНИМАНИЕ: В реальных проектах НЕ храните секреты в Git!
# Используйте Sealed Secrets, External Secrets, или Vault

apiVersion: v1
kind: Secret
metadata:
  name: blockchain-secrets
  namespace: blockchain
  labels:
    app.kubernetes.io/name: blockchain-network
type: Opaque
# Данные в формате base64
# echo -n "value" | base64
data:
  # Пример: API ключ для внешних интеграций
  # В нашем учебном проекте это демо-значение
  api-key: ZGVtby1hcGkta2V5LWZvci1sZWFybmluZw==
  # demo-api-key-for-learning

---
# StringData позволяет указывать значения в plain text
# K8s автоматически закодирует в base64
apiVersion: v1
kind: Secret
metadata:
  name: blockchain-admin
  namespace: blockchain
  labels:
    app.kubernetes.io/name: blockchain-network
type: Opaque
stringData:
  # Не делайте так в продакшене!
  admin-username: "admin"
  admin-password: "blockchain-demo-password"
